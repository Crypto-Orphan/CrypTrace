<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>CrypTrace - Blockchain Explorer</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <canvas id="particles"></canvas>

  <div class="container">
    <div class="header" id="header">
      <button class="header-toggle" id="headerToggle"></button>
      <h1>🔗 CrypTrace - Blockchain Explorer</h1>

      <div id="statusIndicator" class="status-indicator ready">
        準備完了 - APIキー設定済み
      </div>

      <div class="input-section">
        <div class="input-group">
          <label for="chainSelect">チェーン</label>
          <select id="chainSelect"></select>
        </div>

        <div class="input-group">
          <label for="addressInput">アドレス</label>
          <input type="text" id="addressInput" placeholder="0x..." />
        </div>

        <div class="input-group">
          <label for="limitSelect">取引数</label>
          <select id="limitSelect">
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </div>

        <div class="input-group">
          <label for="tokenTypeSelect">トークンタイプ</label>
          <select id="tokenTypeSelect">
            <option value="native">ネイティブ通貨</option>
            <option value="erc20">ERC-20</option>
            <option value="erc721">ERC-721 (NFT)</option>
          </select>
        </div>

        <div class="input-group" id="tokenSelectGroup" style="display: none;">
          <label>トークン選択</label>
          <button id="selectTokenBtn">トークンを選択...</button>
        </div>

        <div class="input-group" id="selectedTokenInfo" style="display: none;">
          <label>選択中</label>
          <div id="selectedTokenDisplay"></div>
        </div>

        <button id="exploreBtn">探索開始</button>
        <button id="resetBtn">リセット</button>
      </div>
    </div>

    <div class="canvas-container">
      <canvas id="mindmapCanvas"></canvas>
      <button class="reset-button" id="resetViewBtn">🎯 ビューをリセット</button>

      <div class="legend" id="legend">
        <div class="legend-header" id="legendHeader">
          <div class="legend-title">凡例</div>
          <button class="legend-toggle" id="legendToggle">▼</button>
        </div>
        <div class="legend-content" id="legendContent">
          <div class="legend-item">
            <div class="legend-icon" style="background:#00ffff;"></div>
            <div class="legend-label">中心アドレス</div>
          </div>
          <div class="legend-item">
            <div class="legend-icon" style="background:#0088ff;"></div>
            <div class="legend-label">低額取引 (&lt; 1 ETH)</div>
          </div>
          <div class="legend-item">
            <div class="legend-icon" style="background:#ff00ff;"></div>
            <div class="legend-label">高額取引 (≥ 1 ETH)</div>
          </div>
          <div class="legend-item">
            <div class="legend-icon hexagon" style="background:#ffaa00;"></div>
            <div class="legend-label">CEX / DEX</div>
          </div>
        </div>
      </div>

      <div class="tooltip" id="tooltip">
        <div class="tooltip-title" id="tooltipTitle"></div>
        <div id="tooltipContent"></div>
      </div>

      <div class="info-panel" id="infoPanel">
        <div class="info-panel-header">
          <div class="info-panel-title">詳細情報</div>
          <button class="close-btn" id="closeBtn">×</button>
        </div>
        <div id="infoPanelContent"></div>
      </div>
    </div>
  </div>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div class="loading-text">データ取得中...</div>
  </div>

  <div class="error-dialog" id="errorDialog">
    <div class="error-title" id="errorTitle"></div>
    <div class="error-message" id="errorMessage"></div>
    <div class="error-details" id="errorDetails"></div>
    <button class="error-close-btn"
      onclick="document.getElementById('errorDialog').classList.remove('show')">
      閉じる
    </button>
  </div>

  <div id="tokenModal" style="display:none;"></div>

  <!-- JavaScript（必ず body の一番下・1回だけ） -->
  <script src="js/api-client.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
