<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>CrypTrace - Blockchain Explorer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <canvas id="particles"></canvas>
    
    <div class="container">
        <div class="header" id="header">
            <h1>🔗 CrypTrace - Blockchain Explorer</h1>
                <button id="toggleHeaderBtn" style="position:absolute;top:10px;right:10px;background:rgba(0,255,255,0.2);border:1px solid #00ffff;color:#00ffff;padding:5px 10px;border-radius:5px;cursor:pointer;font-size:12px;">
                    ▲ Hide
                </button>
            <div id="statusIndicator" class="status-indicator ready">
                Address visualization in a mind-map format
            </div>
            <!-- プログレスバー -->
            <div id="progressContainer" style="display:none;margin-top:10px;">
                <div style="background:rgba(0,255,255,0.1);border-radius:10px;overflow:hidden;height:8px;position:relative;">
                    <div id="progressBar" style="width:0%;height:100%;background:linear-gradient(90deg,#00ffff,#0088ff);box-shadow:0 0 20px rgba(0,255,255,0.8);transition:width 0.3s ease;"></div>
                </div>
                <div id="progressText" style="color:#00ffff;font-size:11px;margin-top:5px;text-align:center;">資産取得中...</div>
            </div>
            <div class="input-section">
                <div class="input-group">
                    <label for="chainSelect">Chain</label>
                    <select id="chainSelect"></select>
                </div>
                <div class="input-group">
                    <label for="addressInput">Address</label>
                    <input type="text" id="addressInput" placeholder="0x..." />
                </div>
                <div class="input-group">
                    <label for="limitSelect">Tx limit</label>
                    <select id="limitSelect">
                        <option value="10">10</option>
                        <option value="20" selected>20</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="tokenTypeSelect">Token Type</label>
                    <select id="tokenTypeSelect">
                        <option value="native">Native Token</option>
                        <option value="erc20">ERC-20</option>
                        <option value="erc721">ERC-721 (NFT)</option>
                    </select>
                </div>
                <div class="input-group" id="tokenSelectGroup" style="display: none;">
                    <label>トークン選択</label>
                    <button id="selectTokenBtn" style="padding: 10px 15px; cursor: pointer;">トークンを選択...</button>
                </div>
                <div class="input-group" id="selectedTokenInfo" style="display: none;">
                    <label>選択中</label>
                    <div id="selectedTokenDisplay" style="
                        padding: 8px 12px;
                        background: rgba(0, 255, 136, 0.2);
                        border-radius: 8px;
                        font-size: 12px;
                        border: 1px solid rgba(0, 255, 136, 0.3);
                    "></div>
                </div>
                <button id="exploreBtn">trace</button>
                <button id="resetBtn" style="
                    background: linear-gradient(135deg, #ff00ff, #ff0088);
                    box-shadow: 0 4px 15px rgba(255, 0, 255, 0.3);
                " onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 6px 20px rgba(255, 0, 255, 0.5)'" 
                   onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 15px rgba(255, 0, 255, 0.3)'">Reset</button>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="mindmapCanvas"></canvas>
            <button class="reset-button" id="resetViewBtn">origin</button>
            
            <!-- 凡例 -->
            <div class="legend" id="legend">
                <div class="legend-header" id="legendHeader">
                    <div class="legend-title">Tips</div>
                    <button id="toggleLegendBtn" style="background:rgba(0,255,255,0.2);border:1px solid #00ffff;color:#00ffff;padding:3px 8px;border-radius:5px;cursor:pointer;font-size:11px;">
                        ▼
                    </button>
                </div>
                <div class="legend-content" id="legendContent">
                    <div class="legend-item">
                        <div style="width:30px;height:30px;display:flex;align-items:center;justify-content:center;">
                            <div style="width:20px;height:20px;border-radius:50%;background:#00ffff;"></div>
                        </div>
                        <div class="legend-label">Target Address</div>
                    </div>
                    <div class="legend-item">
                        <div style="width:30px;height:30px;display:flex;align-items:center;justify-content:center;">
                            <div style="width:10px;height:10px;border-radius:50%;background:#0088ff;"></div>
                        </div>
                        <div class="legend-label">Small ($0-1K)</div>
                    </div>
                    <div class="legend-item">
                        <div style="width:30px;height:30px;display:flex;align-items:center;justify-content:center;">
                            <div style="width:20px;height:20px;border-radius:50%;background:#9933ff;"></div>
                        </div>
                        <div class="legend-label">Middle ($1K-100K)</div>
                    </div>
                    <div class="legend-item">
                        <div style="width:30px;height:30px;display:flex;align-items:center;justify-content:center;">
                            <div style="width:30px;height:30px;border-radius:50%;background:#ff3366;"></div>
                        </div>
                        <div class="legend-label">Large ($100K+)</div>
                    </div>
                    <div class="legend-item">
                        <div style="width:30px;height:30px;display:flex;align-items:center;justify-content:center;padding-left:10px;">
                            <div class="legend-icon hexagon" style="background:#FF9500;"></div>
                        </div>
                        <div class="legend-label">CEX/DEX</div>
                    </div>
                </div>
            </div>
            
            <div class="tooltip" id="tooltip">
                <div class="tooltip-title" id="tooltipTitle"></div>
                <div id="tooltipContent"></div>
            </div>
            
            <div class="info-panel" id="infoPanel">
                <div class="info-panel-header">
                    <div class="info-panel-title">Details</div>
                    <button class="close-btn" id="closeBtn">×</button>
                </div>
                <div id="infoPanelContent"></div>
            </div>
        </div>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div class="loading-text">Loading data...</div>
    </div>

    <div class="error-dialog" id="errorDialog">
        <div class="error-title" id="errorTitle"></div>
        <div class="error-message" id="errorMessage"></div>
        <div class="error-details" id="errorDetails"></div>
        <button class="error-close-btn" onclick="document.getElementById('errorDialog').classList.remove('show')">閉じる</button>
    </div>

    <div id="tokenModal" style="
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.9);
        z-index: 10000;
        justify-content: center;
        align-items: center;
    ">
        <div style="
            background: rgba(15, 15, 25, 0.98);
            border: 2px solid rgba(0, 255, 255, 0.5);
            border-radius: 16px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        ">
            <div style="
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 20px;
                padding-bottom: 15px;
                border-bottom: 2px solid rgba(0, 255, 255, 0.3);
            ">
                <div style="
                    font-size: 24px;
                    background: linear-gradient(90deg, #00ffff, #ff00ff);
                    -webkit-background-clip: text;
                    -webkit-text-fill-color: transparent;
                    background-clip: text;
                ">Select Token</div>
                <button id="closeTokenModal" style="
                    background: rgba(255, 0, 100, 0.8);
                    border: none;
                    color: white;
                    width: 35px;
                    height: 35px;
                    border-radius: 50%;
                    cursor: pointer;
                    font-size: 20px;
                ">×</button>
            </div>

            <div style="margin-bottom: 20px;">
                <select id="searchMethodSelect" style="
                    width: 100%;
                    padding: 10px;
                    background: rgba(30, 30, 45, 0.8);
                    border: 1px solid rgba(0, 255, 255, 0.3);
                    border-radius: 8px;
                    color: #e0e0e0;
                    margin-bottom: 10px;
                ">
                    <option value="symbol">Search by ticker / symbol</option>
                    <option value="address">Search by token address</option>
                </select>
                
                <input type="text" id="customTokenSearch" placeholder="Enter ticker (e.g. USDT, USDC)" 
                    onkeydown="if(event.key==='Enter') runTokenSearch();"
                    style="
                    width: 100%;
                    padding: 12px;
                    background: rgba(30, 30, 45, 0.8);
                    border: 1px solid rgba(0, 255, 255, 0.3);
                    border-radius: 8px;
                    color: #e0e0e0;
                    margin-bottom: 10px;
                    font-size: 16px;
                ">
                
                <button onclick="runTokenSearch();" style="
                    width: 100%;
                    padding: 12px;
                    background: linear-gradient(135deg, #00ffff, #0088ff);
                    border: none;
                    border-radius: 8px;
                    color: #000;
                    font-weight: bold;
                    cursor: pointer;
                    font-size: 16px;
                ">research</button>
                
                <div id="tokenInfoDisplay" style="display: none; margin-top: 15px; padding: 15px; background: rgba(0, 255, 136, 0.1); border-radius: 8px; border: 1px solid rgba(0, 255, 136, 0.3);"></div>
            </div>

            <div style="font-size: 14px; color: #00ffff; margin-bottom: 10px;">主要トークン</div>
            <div id="tokenList"></div>
        </div>
    </div>

</body>

  <!-- =====================================================
       JavaScript 読み込み順（依存関係があるため順番固定）
       ===================================================== -->
  <!-- 1. APIクライアント（Workers経由・キーなし）-->
  <script src="js/api-client.js"></script>
  <!-- 2. アプリ本体（グラフ・UI・イベント）-->
  <script src="js/app.js"></script>
</body>
</html>
