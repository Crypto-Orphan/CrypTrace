<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>CrypTrace - Blockchain Explorer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <canvas id="particles"></canvas>
    
    <div class="container">
        <div class="header" id="header">
            <button class="header-toggle" id="headerToggle"></button>
            <h1>🔗 CrypTrace - Blockchain Explorer</h1>
            <div id="statusIndicator" class="status-indicator ready">
                準備完了 - APIキー設定済み
            </div>
            <div class="input-section">
                <div class="input-group">
                    <label for="chainSelect">チェーン</label>
                    <select id="chainSelect"></select>
                </div>
                <div class="input-group">
                    <label for="addressInput">アドレス</label>
                    <input type="text" id="addressInput" placeholder="0x..." />
                </div>
                <div class="input-group">
                    <label for="limitSelect">取引数</label>
                    <select id="limitSelect">
                        <option value="10">10</option>
                        <option value="20" selected>20</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="tokenTypeSelect">トークンタイプ</label>
                    <select id="tokenTypeSelect">
                        <option value="native">ネイティブ通貨</option>
                        <option value="erc20">ERC-20</option>
                        <option value="erc721">ERC-721 (NFT)</option>
                    </select>
                </div>
                <div class="input-group" id="tokenSelectGroup" style="display: none;">
                    <label>トークン選択</label>
                    <button id="selectTokenBtn" style="padding: 10px 15px; cursor: pointer;">トークンを選択...</button>
                </div>
                <div class="input-group" id="selectedTokenInfo" style="display: none;">
                    <label>選択中</label>
                    <div id="selectedTokenDisplay" style="
                        padding: 8px 12px;
                        background: rgba(0, 255, 136, 0.2);
                        border-radius: 8px;
                        font-size: 12px;
                        border: 1px solid rgba(0, 255, 136, 0.3);
                    "></div>
                </div>
                <button id="exploreBtn">探索開始</button>
                <button id="resetBtn" style="
                    background: linear-gradient(135deg, #ff00ff, #ff0088);
                    box-shadow: 0 4px 15px rgba(255, 0, 255, 0.3);
                " onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 6px 20px rgba(255, 0, 255, 0.5)'" 
                   onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 15px rgba(255, 0, 255, 0.3)'">リセット</button>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="mindmapCanvas"></canvas>
            <button class="reset-button" id="resetViewBtn">🎯 ビューをリセット</button>
            
            <!-- 凡例 -->
            <div class="legend" id="legend">
                <div class="legend-header" id="legendHeader">
                    <div class="legend-title">凡例</div>
                    <button class="legend-toggle" id="legendToggle">▼</button>
                </div>
                <div class="legend-content" id="legendContent">
                    <div class="legend-item">
                        <div class="legend-icon" style="background: #00ffff;"></div>
                        <div class="legend-label">中心アドレス</div>
                    </div>
                    <div class="legend-item">
                        <div class="legend-icon" style="background: #0088ff;"></div>
                        <div class="legend-label">低額取引 (< 1 ETH)</div>
                    </div>
                    <div class="legend-item">
                        <div class="legend-icon" style="background: #ff00ff;"></div>
                        <div class="legend-label">高額取引 (≥ 1 ETH)</div>
                    </div>
                    <div class="legend-item">
                        <div class="legend-icon hexagon" style="background: #ffaa00;"></div>
                        <div class="legend-label">CEX / DEX</div>
                    </div>
                </div>
            </div>
            
            <div class="tooltip" id="tooltip">
                <div class="tooltip-title" id="tooltipTitle"></div>
                <div id="tooltipContent"></div>
            </div>
            
            <div class="info-panel" id="infoPanel">
                <div class="info-panel-header">
                    <div class="info-panel-title">詳細情報</div>
                    <button class="close-btn" id="closeBtn">×</button>
                </div>
                <div id="infoPanelContent"></div>
            </div>
        </div>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div class="loading-text">データ取得中...</div>
    </div>

    <div class="error-dialog" id="errorDialog">
        <div class="error-title" id="errorTitle"></div>
        <div class="error-message" id="errorMessage"></div>
        <div class="error-details" id="errorDetails"></div>
        <button class="error-close-btn" onclick="document.getElementById('errorDialog').classList.remove('show')">閉じる</button>
    </div>

    <div id="tokenModal" style="
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.9);
        z-index: 10000;
        justify-content: center;
        align-items: center;
    ">
        <div style="
            background: rgba(15, 15, 25, 0.98);
            border: 2px solid rgba(0, 255, 255, 0.5);
            border-radius: 16px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        ">
            <div style="
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 20px;
                padding-bottom: 15px;
                border-bottom: 2px solid rgba(0, 255, 255, 0.3);
            ">
                <div style="
                    font-size: 24px;
                    background: linear-gradient(90deg, #00ffff, #ff00ff);
                    -webkit-background-clip: text;
                    -webkit-text-fill-color: transparent;
                    background-clip: text;
                ">トークンを選択</div>
                <button id="closeTokenModal" style="
                    background: rgba(255, 0, 100, 0.8);
                    border: none;
                    color: white;
                    width: 35px;
                    height: 35px;
                    border-radius: 50%;
                    cursor: pointer;
                    font-size: 20px;
                ">×</button>
            </div>

            <div style="margin-bottom: 20px;">
                <select id="searchMethodSelect" style="
                    width: 100%;
                    padding: 10px;
                    background: rgba(30, 30, 45, 0.8);
                    border: 1px solid rgba(0, 255, 255, 0.3);
                    border-radius: 8px;
                    color: #e0e0e0;
                    margin-bottom: 10px;
                ">
                    <option value="symbol">ティッカー/シンボルで検索</option>
                    <option value="address">トークンアドレスで検索</option>
                </select>
                
                <input type="text" id="customTokenSearch" placeholder="ティッカーを入力 (例: USDT, DAI)" 
                    onkeydown="if(event.key==='Enter') runTokenSearch();"
                    style="
                    width: 100%;
                    padding: 12px;
                    background: rgba(30, 30, 45, 0.8);
                    border: 1px solid rgba(0, 255, 255, 0.3);
                    border-radius: 8px;
                    color: #e0e0e0;
                    margin-bottom: 10px;
                    font-size: 16px;
                ">
                
                <button onclick="runTokenSearch();" style="
                    width: 100%;
                    padding: 12px;
                    background: linear-gradient(135deg, #00ffff, #0088ff);
                    border: none;
                    border-radius: 8px;
                    color: #000;
                    font-weight: bold;
                    cursor: pointer;
                    font-size: 16px;
                ">検索</button>
                
                <div id="tokenInfoDisplay" style="display: none; margin-top: 15px; padding: 15px; background: rgba(0, 255, 136, 0.1); border-radius: 8px; border: 1px solid rgba(0, 255, 136, 0.3);"></div>
            </div>

            <div style="font-size: 14px; color: #00ffff; margin-bottom: 10px;">主要トークン</div>
            <div id="tokenList"></div>
        </div>
    </div>

</body>

  <!-- =====================================================
       JavaScript 読み込み順（依存関係があるため順番固定）
       ===================================================== -->
  <!-- 1. APIクライアント（Workers経由・キーなし）-->
  <script src="js/api-client.js"></script>
  <script src="js/constants.js"></script>
  <script src="js/exchange.js"></script>
  <script src="js/particle.js"></script>
  <script src="js/graph.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
